<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="入门级英语单词训练：主题词汇、中文释义、美式音标与例句。" />
    <title>入门单词｜训练中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="site-header.css" />
    <link rel="stylesheet" href="word-lookup.css" />
    <link rel="stylesheet" href="vocabulary.css" />
  </head>
  <body class="vocabulary-page" data-access-protected>
    <main class="vocabulary-shell">
      <header class="vocabulary-header">
        <a class="back-link" href="training-center.html">← 返回训练中心</a>
        <div class="vocabulary-header-row">
          <div>
            <p class="section-kicker">BUILD WORDS · BEGINNER</p>
            <h1>入门单词</h1>
            <p class="vocabulary-lead">先认识一个词，再把它放进一句真正能用的话。</p>
          </div>
          <div class="vocabulary-progress-badge"><strong id="vocabulary-library-count">0</strong><span>/ <span id="vocabulary-total">60</span> 已入词库</span></div>
        </div>
      </header>

      <section class="vocabulary-path" aria-labelledby="vocabulary-path-title">
        <div><p class="section-kicker">TODAY'S PATH</p><h2 id="vocabulary-path-title">看懂，听清，再用起来</h2><p>每次只学一个主题。先听单词，再看中文和例句，最后用自己的判断记录掌握情况。</p></div>
        <span class="vocabulary-path-mark">MVP<br />词义 + 例句</span>
      </section>

      <section class="vocabulary-workspace" aria-labelledby="vocabulary-title">
        <aside class="vocabulary-sidebar">
          <p class="section-kicker">WORD PACKS</p>
          <h2 id="vocabulary-title">选择一个主题</h2>
          <div class="vocabulary-topic-list" id="vocabulary-topic-list"></div>
        </aside>

        <section class="vocabulary-study-area">
          <div class="vocabulary-study-top"><span id="vocabulary-topic-label">人与身份</span><span id="vocabulary-position">1 / 5</span></div>
          <article class="vocabulary-card" id="vocabulary-card" aria-live="polite"></article>
          <div class="vocabulary-navigation"><button type="button" id="vocabulary-prev">← 上一个</button><button type="button" id="vocabulary-next">下一个 →</button></div>
          <p class="vocabulary-teaching-note">建议课堂流程：先遮住中文，让学员猜意思；再播放发音，最后让学员朗读例句。</p>
        </section>
      </section>

      <section class="vocabulary-library" aria-labelledby="vocabulary-library-title">
        <div class="section-heading"><div><p class="section-kicker">YOUR WORD LIBRARY</p><h2 id="vocabulary-library-title">我的本地词库</h2></div><p class="section-note">刷新页面后仍会保留，也可以随时删除</p></div>
        <div id="vocabulary-library-list" class="vocabulary-library-list"></div>
      </section>
    </main>
    <script src="site-header.js"></script>
    <script src="access-gate.js"></script>
    <script src="speech.js"></script>
    <script src="vocabulary.js"></script>
    <script src="word-lookup.js"></script>
  </body>
</html>
