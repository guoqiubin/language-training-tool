<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雅思专区｜语言训练工具</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="desktop-typography.css">
  <link rel="stylesheet" href="site-header.css">
  <link rel="stylesheet" href="ielts.css">
</head>
<body class="ielts-page" data-access-protected>
  <main class="ielts-shell">
    <a class="back-link" href="training-center.html">← 返回训练中心</a>
    <header class="ielts-header">
      <div><p class="section-kicker">SPECIAL PRACTICE · IELTS</p><h1>雅思专区</h1><p>按照雅思听力、写作、阅读和口语四项能力，逐步建立考试训练路径。</p></div>
      <div class="ielts-badge"><strong>IELTS</strong><span>四项能力<br>持续搭建中</span></div>
    </header>
    <section class="ielts-intro"><p class="section-kicker">LEARNING ARCHITECTURE</p><h2>先按能力分区，再按雅思难度训练。</h2><p>这里先展示信息架构。后续每个专区都会严格按照题型、任务要求和能力难度组织内容。</p></section>
    <section class="ielts-section" aria-labelledby="ielts-section-title">
      <div class="section-heading"><div><p class="section-kicker">FOUR SKILLS</p><h2 id="ielts-section-title">选择训练方向</h2></div><span class="ielts-status">当前仅开放信息架构</span></div>
      <div class="ielts-grid">
        <button class="ielts-card ielts-listening" data-ielts-feature="雅思听力" type="button"><span class="ielts-number">01</span><span class="ielts-icon">听</span><span><strong>雅思听力</strong><small>Listening</small><em>场景理解、信息定位与听力题型训练</em></span><b>→</b></button>
        <button class="ielts-card ielts-writing" data-ielts-feature="雅思写作" type="button"><span class="ielts-number">02</span><span class="ielts-icon">写</span><span><strong>雅思写作</strong><small>Writing</small><em>Task 1 与 Task 2 的结构化写作训练</em></span><b>→</b></button>
        <button class="ielts-card ielts-reading" data-ielts-feature="雅思阅读" type="button"><span class="ielts-number">03</span><span class="ielts-icon">读</span><span><strong>雅思阅读</strong><small>Reading</small><em>文章理解、定位、判断与长难句训练</em></span><b>→</b></button>
        <button class="ielts-card ielts-speaking" data-ielts-feature="雅思口语" type="button"><span class="ielts-number">04</span><span class="ielts-icon">说</span><span><strong>雅思口语</strong><small>Speaking</small><em>Part 1、Part 2、Part 3 的表达训练</em></span><b>→</b></button>
      </div>
    </section>
    <p class="ielts-note">点击任意能力模块后，将提示“开发中”。本阶段不提前展示具体题目和课程内容。</p>
  </main>
  <script src="site-header.js"></script>
  <script src="access-entry.js"></script>
  <script src="ielts.js"></script>
</body>
</html>
